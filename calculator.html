
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;place-items:center;background:#101820;font-family:Arial}
.calculator{width:320px;padding:20px;background:#1e293b;border-radius:20px;box-shadow:0 10px 30px #0008}
#display{width:100%;height:80px;margin-bottom:15px;background:#0f172a;color:white;border:0;border-radius:10px;text-align:right;font-size:32px;padding:15px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:55px;border:0;border-radius:10px;font-size:20px;cursor:pointer;background:#334155;color:white}
button:hover{background:#475569}
.operator{background:#2563eb}
.clear{background:#dc2626}
.equal{background:#16a34a}
</style>
</head>
<body>
<div class="calculator">
<input id="display" value="0" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">AC</button>
<button onclick="del()">DEL</button>
<button onclick="percent()">%</button>
<button class="operator" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>
<button onclick="sign()">+/-</button>
<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>
<script>
const display=document.getElementById('display');
function add(v){
 if(display.value==='Error')display.value='0';
 if(display.value==='0'&&'0123456789'.includes(v))display.value=v;
 else display.value+=v;
}
function clearDisplay(){display.value='0'}
function del(){display.value=display.value.slice(0,-1)||'0'}
function percent(){
 try{display.value=String(Number(display.value)/100)}
 catch{display.value='Error'}
}
function sign(){
 if(display.value!=='0')display.value=String(-Number(display.value));
}
function calculate(){
 try{
  if(!/^[0-9+\-*/.() ]+$/.test(display.value))throw Error();
  const result=Function('"use strict";return ('+display.value+')')();
  display.value=Number.isFinite(result)?String(Number(result.toPrecision(12))):'Error';
 }catch{display.value='Error'}
}
</script>
</body>
</html>
